[package]
name = "vk-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI driver host: the kernel-side host of a driver process, spoken to by JSON lines over stdio"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The driver manifest and action types the host is spawned over and acts for.
vk-contracts = { path = "../vk-contracts" }
# The same discipline the harness applies to Claude Code, applied to a
# long-lived child: the process governor (`confine`), the egress sampler
# (`netwatch`) and the tree kill (`launch::kill_tree`). Never vk-kernel: the
# kernel depends on this crate.
vk-harness = { path = "../vk-harness" }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the evidence open: a link at `<evidence dir>/<name>` is
# refused, never followed (ruling R9).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
