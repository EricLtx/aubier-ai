[package]
name = "vk-arch-gemini"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VerticalAI arch adapter: Google's native Gemini API (generateContent, countTokens)"

[dependencies]
vk-contracts = { path = "../vk-contracts" }
vk-kernel = { path = "../vk-kernel" }
# The HTTP plumbing every API arch shares — the redirect policy, the scrub,
# the `http status <code>:` classification — and the Anthropic arch's key
# handling through it. Gemini's wire is its own; nothing else is.
vk-arch-openai-compat = { path = "../vk-arch-openai-compat" }
reqwest.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
