[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/EricLtx/aubier-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "vendored"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# The Ollama adapter's HTTP client. Blocking, because `ArchAdapter::complete`
# is a synchronous call the kernel makes under its own lock; rustls rather than
# the platform's TLS, so the same build works on all three CI runners; no
# default features, so nothing else of reqwest's is pulled in behind it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
# The one URL parser every loopback check goes through — the crate `reqwest`
# parses with, so the check and the client cannot disagree about the host
# (`vk_kernel::arch::origin_loopback`, final review I-4).
url = "2"
# The capital package (vk-capital): a driver leaves the tree as a signed OCI
# image layout. `ed25519-dalek` and `tempfile` were per-crate pins until then.
ed25519-dalek = "2"
flate2 = "1"
tar = "0.4"
tempfile = "3"
walkdir = "2"
